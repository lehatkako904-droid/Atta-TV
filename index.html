<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atta TV - Smart TV Player & Admin Dashboard</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; overflow: hidden; height: 100vh; }

        .screen {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            height: 100vh; width: 100%; overflow: hidden; background: #0d0d0d;
        }
        .screen.active { display: flex; }

        #loginScreen {
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 20%, #10292b 0%, #0d0d0d 70%);
        }
        .login-box {
            width: 360px; background: #181818; border: 1px solid #282828;
            border-radius: 12px; padding: 30px; text-align: center;
        }
        .login-box h1 { color: #dad68d; font-size: 22px; margin-bottom: 6px; }
        .login-box p.sub { color: #888; font-size: 13px; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 12px 14px; margin-bottom: 12px;
            border-radius: 6px; border: 2px solid #333; background: #252525;
            color: #fff; font-size: 15px;
        }
        
        .focusable:focus, .active-focus {
            border-color: #00adb5 !important;
            outline: none !important;
            box-shadow: 0 0 14px rgba(189, 201, 147, 0.8) !important;
            transform: scale(1.02);
            background-color: #00adb5 !important;
            color: #fff !important;
        }
        
        .login-box input.focusable:focus {
            background-color: #252525 !important;
        }

        .btn-login {
            width: 100%; padding: 12px; background: #00adb5; color: #fff; font-weight: bold;
            border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 4px;
        }
        .login-error { color: #ff4d4d; font-size: 13px; margin-top: 10px; min-height: 16px; }
        .admin-link { margin-top: 18px; font-size: 12px; color: #666; cursor: pointer; text-decoration: underline; }

        #tvScreen { height: 100vh; position: relative; }
        .player-container { position: relative; width: 100%; height: 100vh; background: #000; }
        .video-js { width: 100% !important; height: 100vh !important; }

        .floating-controls { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 25; }
        .float-btn {
            background: rgba(24,24,24,0.85); color: #ddd; border: 2px solid transparent; border-radius: 6px;
            padding: 10px 16px; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px); white-space: nowrap;
        }

        .now-playing-label {
            position: absolute; bottom: 70px; right: 20px; background: rgba(0, 0, 0, 0); color: #afb740;
            padding: 12px 22px; border-radius: 8px; font-size: 18px; font-weight: bold; z-index: 25; opacity: 0;
            transition: opacity 0.4s ease; pointer-events: none; border: 1px solid #7a7c6c;
        }
        .now-playing-label.show { opacity: 1; }

        .channel-overlay {
            position: absolute; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90%;
            background: rgba(14,14,14,0.97); border-left: 2px solid #282828; padding: 18px;
            display: flex; flex-direction: column; transform: translateX(100%);
            transition: transform 0.25s ease; z-index: 30;
        }
        .channel-overlay.open { transform: translateX(0); }

        .overlay-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
        .filter-tabs { display: flex; gap: 8px; }
        .tab {
            padding: 8px 12px; background: #252525; border-radius: 6px; font-size: 12px; color: #ccc;
            cursor: pointer; border: 2px solid transparent; white-space: nowrap;
        }
        .tab.active { background: #00adb5; color: #fff; }

        .close-list-btn {
            background: #252525; color: #ddd; border: 2px solid transparent; border-radius: 6px;
            padding: 8px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
        }

        .channel-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }

        .channel-item-row {
            display: flex; align-items: center; gap: 6px; width: 100%;
        }

        .channel-item {
            flex: 1; padding: 12px 14px; background: #252525; border-radius: 6px; cursor: pointer;
            font-size: 14px; color: #ddd; border: 2px solid transparent; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .channel-item .channel-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channel-item.playing { border-right: 5px solid #bc3535; }

        .move-btn {
            background: #181818; color: #00adb5; border: 1px solid #333; border-radius: 4px;
            padding: 8px 10px; font-size: 12px; cursor: pointer; font-weight: bold;
        }
        .move-btn:hover { background: #2c3031; color: #fff; }

        #adminScreen { height: 100vh; width: 100%; padding: 20px; flex-direction: column; overflow: hidden; }
        .admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .admin-topbar h1 { color: #67603e; font-size: 20px; }
        .logout-btn {
            background: #252525; color: #ddd; border: 2px solid transparent; border-radius: 6px;
            padding: 8px 16px; font-size: 13px; cursor: pointer;
        }

        .admin-body { display: flex; gap: 18px; flex: 1; min-height: 0; }
        .admin-form-panel {
            flex: 1; min-width: 300px; background: #181818; border-radius: 10px; padding: 18px;
            display: flex; flex-direction: column;
        }
        .admin-form-panel h2 { color: #b1a04b; font-size: 16px; margin-bottom: 14px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        .form-group input {
            width: 100%; padding: 10px; border-radius: 5px; border: 2px solid #333;
            background: #252525; color: #fff; font-size: 14px;
        }
        .btn-submit {
            width: 100%; padding: 11px; background: #a6802e; color: #fff; font-weight: bold;
            border: 2px solid transparent; border-radius: 6px; cursor: pointer; margin-top: 6px; font-size: 14px;
        }

        .admin-table-panel {
            flex: 2; min-width: 360px; background: #181818; border-radius: 10px; padding: 18px;
            display: flex; flex-direction: column; min-height: 0;
        }
        .admin-table-panel h2 { color: #a15559; font-size: 16px; margin-bottom: 12px; }
        .table-container { flex: 1; overflow-y: auto; border: 1px solid #282828; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #282828; padding: 8px; text-align: center; }
        th { background: #222; color: #b6b251; position: sticky; top: 0; }
        .status-active { color: #00ff66; font-weight: bold; }
        .status-expired { color: #ff4d4d; font-weight: bold; }
        .status-blocked { color: #ffb84d; font-weight: bold; }
        .row-btn {
            border: none; border-radius: 4px; padding: 6px 10px; font-size: 11px; font-weight: bold;
            cursor: pointer; color: #fff; margin: 2px;
        }
        .btn-block { background: #b53d3d; }
        .btn-unblock { background: #2e8b57; }
        .btn-delete { background: #444; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen active">
        <div class="login-box">
            <h1>Atta_tv</h1>
            <p class="sub">تکایە بچۆ ژوورەوە بۆ بینینی کەناڵەکان</p>
            <input type="text" id="loginUsername" class="focusable" placeholder="ناوی بەکارهێنەر">
            <input type="password" id="loginPassword" class="focusable" placeholder="وشەی نهێنی">
            <button class="btn-login focusable" id="btnUserLogin">چوونەژوورەوە</button>
            <div class="login-error" id="loginError"></div>
            <div class="admin-link focusable" id="adminLoginLink" tabindex="0">چوونەژوورەوەی بەڕێوەبەر</div>
        </div>
    </div>

    <!-- TV PLAYER SCREEN -->
    <div id="tvScreen" class="screen">
        <div class="player-container">
            <video id="tv-player" class="video-js vjs-default-skin" controls preload="auto">
                <source src="" type="application/x-mpegURL">
            </video>

           <div class="floating-controls">
    <button class="float-btn focusable" id="btnToggleList">☰ لیستی کەناڵەکان</button>
</div>
<button class="float-btn focusable" id="btnTvLogout" style="position:absolute; bottom:20px; left:20px; z-index:25;">چوونەدەرەوە</button>

            <div class="now-playing-label" id="nowPlayingLabel"></div>
        </div>

        <div class="channel-overlay" id="channelOverlay">
            <div class="overlay-header">
                <div class="filter-tabs">
                    <div class="tab focusable active" data-filter="all">هەمووی</div>
                </div>
                <button class="close-list-btn focusable" id="btnCloseList">داخستن ✕</button>
            </div>
            <div class="channel-list" id="channelList">
                <p style="text-align:center; color:#888; margin-top:20px;">تکایە چاوەڕێ بکە...</p>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD SCREEN -->
    <div id="adminScreen" class="screen">
        <div class="admin-topbar">
            <h1>داشبۆردی بەڕێوەبەر - بەڕێوەبردنی بەکارهێنەران</h1>
            <button class="logout-btn focusable" id="btnAdminLogout">چوونەدەرەوە</button>
        </div>
        <div class="admin-body">
            <div class="admin-form-panel">
                <h2>زیادکردنی بەکارهێنەری نوێ</h2>
                <form id="userForm">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر:</label>
                        <input type="text" id="newUsername" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی:</label>
                        <input type="text" id="newPassword" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>کاتی دەستپێکردن:</label>
                        <input type="date" id="startDate" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>کاتی بەسەرچوون:</label>
                        <input type="date" id="expireDate" class="focusable" required>
                    </div>
                    <button type="submit" id="btnSave" class="btn-submit focusable">زیادکردنی بەکارهێنەر</button>
                </form>
            </div>

            <div class="admin-table-panel">
                <h2>بەکارهێنەرە تۆمارکراوەکان (Google Sheet)</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>بەکارهێنەر</th>
                                <th>دەستپێک</th>
                                <th>بەسەرچوون</th>
                                <th>بارودۆخ</th>
                                <th>کردار</th>
                            </tr>
                        </thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgg7tupLXz54niN1LMj-uAl3C16fw27JkDNUNEZo29nCxGnnioVJpQQpGrNCx9KjIO/exec";
    
    const rawM3uUrls = [
        "https://raw.githubusercontent.com/lehatkako904-droid/Atta_tv/main/ata-tv-all.m3u.m3u",
        "https://raw.githubusercontent.com/lehatkako904-droid/Atta_tv/main/ata-tv-all.m3u"
    ];

    const ADMIN_USER = "admin";
    const ADMIN_PASS = "admin123";

    let player = null;
    let focusableElements = [];
    let currentIndex = 0;
    let currentUser = null;
    let cachedUsers = [];

    let channelsData = [];
    let currentPlayIndex = -1;  
    let channelsLoaded = false;
    let nowPlayingTimeout = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        refreshFocusableList();
    }

    function todayStr() {
        return new Date().toISOString().split('T')[0];
    }

    async function fetchUsersFromSheet() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getUsers`);
            cachedUsers = await res.json();
            return cachedUsers;
        } catch (err) {
            console.error("هەڵە لە ڕاکێشانی بەکارهێنەران:", err);
            return [];
        }
    }

    /* ---------- Viewer Login ---------- */
    document.getElementById('btnUserLogin').onclick = async function() {
        const uname = document.getElementById('loginUsername').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();
        const errBox = document.getElementById('loginError');
        errBox.innerText = 'چاوەڕێ بکە...';

        if (!uname || !pass) {
            errBox.innerText = 'تکایە ناو و وشەی نهێنی بنووسە.';
            return;
        }

        const users = await fetchUsersFromSheet();
        const found = users.find(u => u.username === uname && u.password === pass);

        if (!found) {
            errBox.innerText = 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە.';
            return;
        }
        if (found.blocked) {
            errBox.innerText = '⛔ ئەم هەژمارە بلۆککراوە لەلایەن بەڕێوەبەرەوە.';
            return;
        }
        if (found.expire < todayStr()) {
            errBox.innerText = '⏰ ماوەی بەکارهێنانی ئەم هەژمارە بەسەرچووە.';
            return;
        }

        errBox.innerText = '';
        currentUser = found;
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        loadChannelsIfNeeded();
        showScreen('tvScreen');
    };

    document.getElementById('btnTvLogout').onclick = function() {
        currentUser = null;
        if (player) player.pause();
        toggleChannelList(false);
        showScreen('loginScreen');
    };

    /* ---------- Admin Login ---------- */
    document.getElementById('adminLoginLink').onclick = function() {
        const u = prompt('ناوی بەکارهێنەری بەڕێوەبەر:');
        if (u === null) return;
        const p = prompt('وشەی نهێنی:');
        if (p === null) return;

        if (u.trim() === ADMIN_USER && p.trim() === ADMIN_PASS) {
            renderUserTable();
            showScreen('adminScreen');
        } else {
            alert('ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە!');
        }
    };

    document.getElementById('btnAdminLogout').onclick = function() {
        showScreen('loginScreen');
    };

    /* ---------- Admin Actions ---------- */
    document.getElementById('userForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        btn.innerText = 'خەریکی زەخیرەکردنە...';
        btn.disabled = true;

        const username = document.getElementById('newUsername').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        const start = document.getElementById('startDate').value;
        const expire = document.getElementById('expireDate').value;

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "addUser", username, password, start, expire })
        });

        this.reset();
        btn.innerText = 'زیادکردنی بەکارهێنەر';
        btn.disabled = false;
        renderUserTable();
    };

    async function toggleBlockUser(username) {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "toggleBlock", username })
        });
        renderUserTable();
    }

    async function deleteUser(username) {
        if (!confirm('دڵنیایت لە سڕینەوەی ئەم بەکارهێنەرە؟')) return;
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "deleteUser", username })
        });
        renderUserTable();
    }

    async function renderUserTable() {
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = `<tr><td colspan="5" style="color:#00adb5;">خەریکی بارکردنی بەکارهێنەرانە لە Google Sheet...</td></tr>`;

        const users = await fetchUsersFromSheet();
        const today = todayStr();

        if (users.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="5">هیچ بەکارهێنەرێک تۆمار نەکراوە.</td></tr>`;
            refreshFocusableList();
            return;
        }

        tbody.innerHTML = users.map(u => {
            const isExpired = u.expire < today;
            let statusHtml;
            if (u.blocked) statusHtml = `<span class="status-blocked">بلۆککراوە</span>`;
            else if (isExpired) statusHtml = `<span class="status-expired">بەسەرچووە</span>`;
            else statusHtml = `<span class="status-active">چالاکە</span>`;

            return `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.start || '--'}</td>
                    <td>${u.expire || '--'}</td>
                    <td>${statusHtml}</td>
                    <td>
                        <button class="row-btn focusable ${u.blocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlockUser('${u.username}')">${u.blocked ? 'لابردنی بلۆک' : 'بلۆککردن'}</button>
                        <button class="row-btn focusable btn-delete" onclick="deleteUser('${u.username}')">سڕینەوە</button>
                    </td>
                </tr>
            `;
        }).join('');

        refreshFocusableList();
    }

    /* ---------- Channels Fetcher ---------- */
    async function fetchM3uContent(targetUrl) {
        const proxies = [
            (url) => url,
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        for (let getUrl of proxies) {
            try {
                const res = await fetch(getUrl(targetUrl));
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.includes('#EXTINF')) return text;
                }
            } catch (e) {}
        }
        return null;
    }

    function parseM3u(data) {
        const lines = data.split('\n');
        let currentName = "";
        channelsData = [];

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                currentName = line.split(',')[1] || "کەناڵی بێ ناو";
            } else if (line.startsWith('http')) {
                channelsData.push({ name: currentName, url: line });
            }
        });
    }

    async function loadChannelsIfNeeded() {
        if (channelsLoaded) { renderChannelList(); return; }
        if (!player) player = videojs('tv-player');

        const listContainer = document.getElementById('channelList');
        listContainer.innerHTML = `<p style="text-align:center; color:#00adb5; margin-top:20px;">لە حاڵەتی بارکردنی کەناڵەکاندا...</p>`;

        let fetchedData = null;
        for (let targetUrl of rawM3uUrls) {
            fetchedData = await fetchM3uContent(targetUrl);
            if (fetchedData) break;
        }

        if (fetchedData) {
            parseM3u(fetchedData);
            channelsLoaded = true;
            renderChannelList();
            if (channelsData.length > 0) {
                playChannelByIndex(0);
            }
        } else {
            listContainer.innerHTML = `<p style="color:#ff4d4d; text-align:center; margin-top:20px;">نەتوانرا کەناڵەکان باربکرێن!</p>`;
        }
    }

    /* ---------- Reorder Channel Logic ---------- */
    function moveChannel(idx, direction) {
        let newIndex = idx + direction;
        if (newIndex < 0 || newIndex >= channelsData.length) return;

        // Swap channels in array
        let temp = channelsData[idx];
        channelsData[idx] = channelsData[newIndex];
        channelsData[newIndex] = temp;

        if (currentPlayIndex === idx) currentPlayIndex = newIndex;
        else if (currentPlayIndex === newIndex) currentPlayIndex = idx;

        renderChannelList();

        // Refocus on moved item
        setTimeout(() => {
            let items = document.querySelectorAll('.channel-item');
            if (items[newIndex]) items[newIndex].focus();
        }, 50);
    }

    function renderChannelList() {
        const listContainer = document.getElementById('channelList');
        if (channelsData.length === 0) return;

        listContainer.innerHTML = channelsData.map((c, idx) => `
            <div class="channel-item-row">
                <div class="channel-item focusable" tabindex="0" data-idx="${idx}" onclick="playChannelByIndex(${idx}); toggleChannelList(false);">
                    <span class="channel-name">${idx + 1}. ${c.name}</span>
                </div>
                <button class="move-btn focusable" title="سەرەوە" onclick="moveChannel(${idx}, -1)">▲</button>
                <button class="move-btn focusable" title="خوارەوە" onclick="moveChannel(${idx}, 1)">▼</button>
            </div>
        `).join('');

        refreshFocusableList();
    }

    function playChannelByIndex(idx) {
        if (channelsData.length === 0) return;
        if (idx < 0) idx = channelsData.length - 1;
        if (idx >= channelsData.length) idx = 0;

        currentPlayIndex = idx;
        const ch = channelsData[idx];

        player.src({ src: ch.url, type: 'application/x-mpegURL' });
        player.play().catch(e => console.log("Play interrupted"));
        showNowPlaying(`${idx + 1}. ${ch.name}`);

        document.querySelectorAll('.channel-item').forEach((el, i) => {
            el.classList.toggle('playing', i === idx);
        });
    }

    function showNowPlaying(name) {
        const label = document.getElementById('nowPlayingLabel');
        label.innerText = name;
        label.classList.add('show');
        clearTimeout(nowPlayingTimeout);
        nowPlayingTimeout = setTimeout(() => label.classList.remove('show'), 3000);
    }

    function toggleChannelList(forceState) {
        const overlay = document.getElementById('channelOverlay');
        const shouldOpen = (typeof forceState === 'boolean') ? forceState : !overlay.classList.contains('open');
        overlay.classList.toggle('open', shouldOpen);
        refreshFocusableList();
    }

    document.getElementById('btnToggleList').onclick = function() { toggleChannelList(true); };
    document.getElementById('btnCloseList').onclick = function() { toggleChannelList(false); };

    function refreshFocusableList() {
        const tvActive = document.getElementById('tvScreen').classList.contains('active');
        if (tvActive) {
            const listOpen = document.getElementById('channelOverlay').classList.contains('open');
            focusableElements = listOpen
                ? Array.from(document.querySelectorAll('#channelOverlay .focusable'))
                : Array.from(document.querySelectorAll('.floating-controls .focusable'));
        } else {
            const activeScreen = document.querySelector('.screen.active');
            if (!activeScreen) return;
            focusableElements = Array.from(activeScreen.querySelectorAll('.focusable'));
        }
        
        currentIndex = 0;
        if (focusableElements.length > 0) {
            focusableElements[0].focus();
        }
    }

    /* =========================================================
       Smart TV & Remote Control Keydown Event Handler
       ========================================================= */
    document.addEventListener('keydown', function(e) {
        const keyCode = e.keyCode;
        const listOpen = document.getElementById('channelOverlay').classList.contains('open');
        const isTvActive = document.getElementById('tvScreen').classList.contains('active');

        switch (keyCode) {
            case 38: // Arrow Up
                e.preventDefault();
                if (isTvActive && !listOpen) {
                    playChannelByIndex(currentPlayIndex - 1);
                } else if (listOpen && e.shiftKey && document.activeElement.classList.contains('channel-item')) {
                    // Shift + Up = Move Channel Up
                    let idx = parseInt(document.activeElement.getAttribute('data-idx'));
                    moveChannel(idx, -1);
                } else if (focusableElements.length > 0) {
                    currentIndex = (currentIndex - 1 + focusableElements.length) % focusableElements.length;
                    focusableElements[currentIndex].focus();
                }
                break;

            case 40: // Arrow Down
                e.preventDefault();
                if (isTvActive && !listOpen) {
                    playChannelByIndex(currentPlayIndex + 1);
                } else if (listOpen && e.shiftKey && document.activeElement.classList.contains('channel-item')) {
                    // Shift + Down = Move Channel Down
                    let idx = parseInt(document.activeElement.getAttribute('data-idx'));
                    moveChannel(idx, 1);
                } else if (focusableElements.length > 0) {
                    currentIndex = (currentIndex + 1) % focusableElements.length;
                    focusableElements[currentIndex].focus();
                }
                break;

            case 37: // Arrow Left
            case 39: // Arrow Right
                if (focusableElements.length > 0) {
                    if (keyCode === 37) currentIndex = (currentIndex + 1) % focusableElements.length;
                    else currentIndex = (currentIndex - 1 + focusableElements.length) % focusableElements.length;
                    focusableElements[currentIndex].focus();
                }
                break;

            case 13: // Enter / OK
                if (document.activeElement) {
                    document.activeElement.click();
                }
                break;

            case 33: // Page Up / Channel Up
            case 427:
                e.preventDefault();
                if (isTvActive) playChannelByIndex(currentPlayIndex - 1);
                break;

            case 34: // Page Down / Channel Down
            case 428:
                e.preventDefault();
                if (isTvActive) playChannelByIndex(currentPlayIndex + 1);
                break;

            case 461: // webOS Back
            case 8:   // Backspace
            case 27:  // Escape
                e.preventDefault();
                if (listOpen) toggleChannelList(false);
                else if (isTvActive) toggleChannelList(true);
                break;

            case 406: // Blue Button / LIST
                if (isTvActive) toggleChannelList();
                break;
        }
    });

    showScreen('loginScreen');
</script>
