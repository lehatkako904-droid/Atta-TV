<script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        const m3uUrl = "https://lehatkako904-droid.github.io/Atta_tv/ata-tv-all.m3u.m3u";
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        let player = null;
        let focusableElements = [];
        let currentIndex = 0;
        let currentUser = null;

        let channelsData = [];      // [{name, url}]
        let currentPlayIndex = -1;  // index within channelsData currently playing
        let currentFilter = 'all';  // 'all' | 'fav'
        let channelsLoaded = false;
        let nowPlayingTimeout = null;

        /* ---------- Screen switching ---------- */
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            refreshFocusableList();
        }

        /* ---------- User data helpers ---------- */
        function getUsers() {
            return JSON.parse(localStorage.getItem('tv_users') || '[]');
        }
        function saveUsers(users) {
            localStorage.setItem('tv_users', JSON.stringify(users));
        }
        function todayStr() {
            return new Date().toISOString().split('T')[0];
        }

        /* ---------- Viewer login ---------- */
        document.getElementById('btnUserLogin').onclick = function() {
            const uname = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const errBox = document.getElementById('loginError');
            errBox.innerText = '';

            if (!uname || !pass) {
                errBox.innerText = 'تکایە ناو و وشەی نهێنی بنووسە.';
                return;
            }

            const users = getUsers();
            const found = users.find(u => u.username === uname && u.password === pass);

            if (!found) {
                errBox.innerText = 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە.';
                return;
            }
            if (found.blocked) {
                errBox.innerText = '⛔ ئەم هەژمارە بلۆککراوە لەلایەن بەڕێوەبەرەوە.';
                return;
            }
            if (found.expire < todayStr()) {
                errBox.innerText = '⏰ ماوەی بەکارهێنانی ئەم هەژمارە بەسەرچووە.';
                return;
            }

            currentUser = found;
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            loadChannelsIfNeeded();
            showScreen('tvScreen');
        };

        document.getElementById('btnTvLogout').onclick = function() {
            currentUser = null;
            if (player) player.pause();
            toggleChannelList(false);
            showScreen('loginScreen');
        };

        /* ---------- Admin login ---------- */
        document.getElementById('adminLoginLink').onclick = function() {
            const u = prompt('ناوی بەکارهێنەری بەڕێوەبەر:');
            if (u === null) return;
            const p = prompt('وشەی نهێنی:');
            if (p === null) return;

            if (u.trim() === ADMIN_USER && p.trim() === ADMIN_PASS) {
                renderUserTable();
                showScreen('adminScreen');
            } else {
                alert('ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە!');
            }
        };

        document.getElementById('btnAdminLogout').onclick = function() {
            showScreen('loginScreen');
        };

        /* ---------- Admin: add / block / delete users ---------- */
        document.getElementById('userForm').onsubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const start = document.getElementById('startDate').value;
            const expire = document.getElementById('expireDate').value;

            const users = getUsers();
            if (users.some(u => u.username === username)) {
                alert('ئەم ناوی بەکارهێنەرە پێشتر بوونی هەیە!');
                return;
            }

            users.push({ username, password, start, expire, blocked: false });
            saveUsers(users);
            this.reset();
            renderUserTable();
        };

        function toggleBlockUser(username) {
            const users = getUsers().map(u => {
                if (u.username === username) return { ...u, blocked: !u.blocked };
                return u;
            });
            saveUsers(users);
            renderUserTable();
        }

        function deleteUser(username) {
            if (!confirm('دڵنیایت لە سڕینەوەی ئەم بەکارهێنەرە؟')) return;
            const users = getUsers().filter(u => u.username !== username);
            saveUsers(users);
            renderUserTable();
        }

        function renderUserTable() {
            const users = getUsers();
            const tbody = document.getElementById('userTable');
            const today = todayStr();

            if (users.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">هیچ بەکارهێنەرێک تۆمار نەکراوە.</td></tr>`;
                refreshFocusableList();
                return;
            }

            tbody.innerHTML = users.map(u => {
                const isExpired = u.expire < today;
                let statusHtml;
                if (u.blocked) statusHtml = `<span class="status-blocked">بلۆککراوە</span>`;
                else if (isExpired) statusHtml = `<span class="status-expired">بەسەرچووە</span>`;
                else statusHtml = `<span class="status-active">چالاکە</span>`;

                return `
                    <tr>
                        <td>${u.username}</td>
                        <td>${u.start || '--'}</td>
                        <td>${u.expire || '--'}</td>
                        <td>${statusHtml}</td>
                        <td>
                            <button class="row-btn focusable ${u.blocked ? 'btn-unblock' : 'btn-block'}" tabindex="0" onclick="toggleBlockUser('${u.username}')">${u.blocked ? 'لابردنی بلۆک' : 'بلۆککردن'}</button>
                            <button class="row-btn focusable btn-delete" tabindex="0" onclick="deleteUser('${u.username}')">سڕینەوە</button>
                        </td>
                    </tr>
                `;
            }).join('');

            refreshFocusableList();
        }

        /* ---------- Favorites ---------- */
        function getFavorites() {
            return JSON.parse(localStorage.getItem('tv_favorites') || '[]');
        }
        function saveFavorites(arr) {
            localStorage.setItem('tv_favorites', JSON.stringify(arr));
        }
        function isFavorite(url) {
            return getFavorites().includes(url);
        }
        function toggleFavorite(url) {
            let favs = getFavorites();
            if (favs.includes(url)) favs = favs.filter(u => u !== url);
            else favs.push(url);
            saveFavorites(favs);
        }

        /* ---------- Custom channel order (drag position persistence) ---------- */
        function getSavedOrder() {
            return JSON.parse(localStorage.getItem('tv_channel_order') || '[]');
        }
        function saveChannelOrder() {
            localStorage.setItem('tv_channel_order', JSON.stringify(channelsData.map(c => c.url)));
        }
        function applySavedOrder() {
            const order = getSavedOrder();
            if (order.length === 0) return;
            const orderIndex = new Map(order.map((u, i) => [u, i]));
            channelsData.sort((a, b) => {
                const ai = orderIndex.has(a.url) ? orderIndex.get(a.url) : Infinity;
                const bi = orderIndex.has(b.url) ? orderIndex.get(b.url) : Infinity;
                return ai - bi;
            });
        }
        function moveChannel(idx, direction) {
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= channelsData.length) return;

            const temp = channelsData[idx];
            channelsData[idx] = channelsData[targetIdx];
            channelsData[targetIdx] = temp;

            if (currentPlayIndex === idx) currentPlayIndex = targetIdx;
            else if (currentPlayIndex === targetIdx) currentPlayIndex = idx;

            saveChannelOrder();
            renderChannelList();
        }

        /* ---------- Channels (M3U) ---------- */
        function loadChannelsIfNeeded() {
            if (channelsLoaded) { renderChannelList(); return; }
            if (!player) player = videojs('tv-player');

            fetch(m3uUrl)
                .then(res => res.text())
                .then(data => {
                    const lines = data.split('\n');
                    let currentName = "";
                    channelsData = [];

                    lines.forEach(line => {
                        line = line.trim();
                        if (line.startsWith('#EXTINF:')) {
                            currentName = line.split(',')[1] || "کەناڵی بێ ناو";
                        } else if (line.startsWith('http')) {
                            channelsData.push({ name: currentName, url: line });
                        }
                    });

                    channelsLoaded = true;
                    applySavedOrder();
                    renderChannelList();
                })
                .catch(() => {
                    document.getElementById('channelList').innerHTML =
                        '<p style="color:red; text-align:center;">کێشەیەک لە بارکردنی کەناڵەکان ڕوویدا!</p>';
                });
        }

        function renderChannelList() {
            const listContainer = document.getElementById('channelList');
            const favs = getFavorites();
            const items = channelsData
                .map((c, idx) => ({ ...c, idx }))
                .filter(c => currentFilter === 'fav' ? favs.includes(c.url) : true);

            if (items.length === 0) {
                listContainer.innerHTML = currentFilter === 'fav'
                    ? '<p style="text-align:center; color:#888; margin-top:20px;">هیچ کەناڵی دڵخوازت نییە. ئەستێرەکە کلیک بکە بۆ زیادکردن.</p>'
                    : '<p style="text-align:center; color:#888; margin-top:20px;">هیچ کەناڵێک نەدۆزرایەوە.</p>';
                refreshFocusableList();
                return;
            }

            listContainer.innerHTML = items.map((c, listPos) => {
                const fav = favs.includes(c.url);
                const playingClass = c.idx === currentPlayIndex ? 'playing' : '';
                const canReorder = currentFilter === 'all';
                const isFirst = c.idx === 0;
                const isLast = c.idx === channelsData.length - 1;

                const moveButtonsHtml = canReorder ? `
                    <span class="move-buttons">
                        <span class="move-btn ${isFirst ? 'disabled' : ''}" data-action="up" data-index="${c.idx}">▲</span>
                        <span class="move-btn ${isLast ? 'disabled' : ''}" data-action="down" data-index="${c.idx}">▼</span>
                    </span>
                ` : '';

                return `
                    <div class="channel-item focusable ${playingClass}" tabindex="0" data-index="${c.idx}">
                        <span class="channel-name">${c.name}</span>
                        ${moveButtonsHtml}
                        <span class="fav-star ${fav ? 'active' : ''}" data-url="${c.url.replace(/"/g, '&quot;')}">★</span>
                    </div>
                `;
            }).join('');

            listContainer.querySelectorAll('.move-btn').forEach(btn => {
                btn.onclick = function(ev) {
                    ev.stopPropagation();
                    if (this.classList.contains('disabled')) return;
                    const idx = parseInt(this.dataset.index, 10);
                    const direction = this.dataset.action === 'up' ? -1 : 1;
                    moveChannel(idx, direction);
                };
            });

            listContainer.querySelectorAll('.channel-item').forEach(el => {
                el.onclick = function(ev) {
                    if (ev.target.classList.contains('fav-star')) return;
                    const idx = parseInt(this.dataset.index, 10);
                    playChannelByIndex(idx);
                    toggleChannelList(false);
                };
            });

            listContainer.querySelectorAll('.fav-star').forEach(star => {
                star.onclick = function(ev) {
                    ev.stopPropagation();
                    toggleFavorite(this.dataset.url);
                    renderChannelList();
                };
            });

            refreshFocusableList();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.filter === filter);
            });
            renderChannelList();
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = function() { setFilter(this.dataset.filter); };
        });

        function playChannelByIndex(idx) {
            if (channelsData.length === 0) return;
            if (idx < 0) idx = channelsData.length - 1;
            if (idx >= channelsData.length) idx = 0;

            currentPlayIndex = idx;
            const ch = channelsData[idx];

            player.src({ src: ch.url, type: 'application/x-mpegURL' });
            player.play();
            showNowPlaying(ch.name);

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('playing'));
            const activeEl = document.querySelector(`.channel-item[data-index="${idx}"]`);
            if (activeEl) activeEl.classList.add('playing');
        }

        function changeChannel(direction) {
            if (channelsData.length === 0) return;
            const startIdx = currentPlayIndex === -1 ? 0 : currentPlayIndex + direction;
            playChannelByIndex(startIdx);
        }

        function showNowPlaying(name, duration) {
            const label = document.getElementById('nowPlayingLabel');
            label.innerText = name;
            label.classList.add('show');
            clearTimeout(nowPlayingTimeout);
            nowPlayingTimeout = setTimeout(() => label.classList.remove('show'), duration || 2500);
        }

        /* ---------- Channel list overlay toggle ---------- */
        function toggleChannelList(forceState) {
            const overlay = document.getElementById('channelOverlay');
            const shouldOpen = (typeof forceState === 'boolean') ? forceState : !overlay.classList.contains('open');
            overlay.classList.toggle('open', shouldOpen);
            refreshFocusableList();
        }

        document.getElementById('btnToggleList').onclick = function() { toggleChannelList(true); };
        document.getElementById('btnCloseList').onclick = function() { toggleChannelList(false); };

        /* ---------- Focus management (remote control) ---------- */
        function refreshFocusableList() {
            const tvActive = document.getElementById('tvScreen').classList.contains('active');

            if (tvActive) {
                const listOpen = document.getElementById('channelOverlay').classList.contains('open');
                focusableElements = listOpen
                    ? Array.from(document.querySelectorAll('#channelOverlay .focusable'))
                    : Array.from(document.querySelectorAll('.floating-controls .focusable'));
            } else {
                const activeScreen = document.querySelector('.screen.active');
                if (!activeScreen) return;
                focusableElements = Array.from(activeScreen.querySelectorAll('.focusable'));
            }

            currentIndex = 0;
            if (focusableElements.length > 0) setFocus(0);
        }

        function setFocus(index) {
            if (focusableElements.length === 0) return;
            if (index < 0) index = 0;
            if (index >= focusableElements.length) index = focusableElements.length - 1;
            currentIndex = index;
            focusableElements[currentIndex].focus();
            focusableElements[currentIndex].scrollIntoView({ block: 'nearest' });
        }

        function toggleFavoriteCurrent() {
            if (currentPlayIndex === -1 || !channelsData[currentPlayIndex]) return;
            const ch = channelsData[currentPlayIndex];
            toggleFavorite(ch.url);
            const nowFav = isFavorite(ch.url);
            showNowPlaying((nowFav ? '★ زیادکرا بۆ دڵخوازەکان: ' : 'لابرا لە دڵخوازەکان: ') + ch.name);
        }

        /* Direct channel number entry via remote number pad (e.g. "12" + pause -> channel 12) */
        let digitBuffer = '';
        let digitTimeout = null;
        function handleDigitInput(digit) {
            digitBuffer += String(digit);
            showNowPlaying('کەناڵ: ' + digitBuffer);
            clearTimeout(digitTimeout);
            digitTimeout = setTimeout(() => {
                const num = parseInt(digitBuffer, 10);
                digitBuffer = '';
                if (!isNaN(num) && num >= 1 && num <= channelsData.length) {
                    playChannelByIndex(num - 1);
                }
            }, 1200);
        }

        /* ---------- Remote key listener ---------- */
        document.addEventListener('keydown', function(e) {
            const tvActive = document.getElementById('tvScreen').classList.contains('active');
            const overlayOpen = document.getElementById('channelOverlay').classList.contains('open');

            // Digit Key Handler (0-9)
            if (tvActive && e.key >= '0' && e.key <= '9') {
                handleDigitInput(e.key);
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    setFocus(currentIndex - 1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    setFocus(currentIndex + 1);
                    break;
                case 'ArrowLeft':
                case 'ArrowRight':
                    if (tvActive && !overlayOpen) {
                        e.preventDefault();
                        setFocus(currentIndex === 0 ? 1 : 0);
                    }
                    break;
                case 'Enter':
                    if (tvActive && !overlayOpen && document.activeElement === document.body) {
                        toggleChannelList(true);
                    } else if (focusableElements[currentIndex]) {
                        focusableElements[currentIndex].click();
                    }
                    break;
                case 'Escape':
                case 'BackSpace':
                    if (tvActive && overlayOpen) {
                        e.preventDefault();
                        toggleChannelList(false);
                    }
                    break;
                case 'ChannelUp':
                case 'PageUp':
                    if (tvActive) changeChannel(1);
                    break;
                case 'ChannelDown':
                case 'PageDown':
                    if (tvActive) changeChannel(-1);
                    break;
                case 'F3': // Common TV Yellow button mapping for favorites
                    if (tvActive) toggleFavoriteCurrent();
                    break;
            }
        });

        /* ---------- Initialize App ---------- */
        showScreen('loginScreen');
    </script>
</body>
</html>
