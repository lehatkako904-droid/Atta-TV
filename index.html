<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atta TV - Smart TV Player & Admin Dashboard</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; overflow: hidden; height: 100vh; }

        .screen { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; width: 100%; overflow: hidden; background: #0d0d0d; }
        .screen.active { display: flex; }

        /* ============ LOGIN SCREEN ============ */
        #loginScreen { align-items: center; justify-content: center; background: radial-gradient(circle at 50% 20%, #10292b 0%, #0d0d0d 70%); }
        .login-box { width: 360px; background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 30px; text-align: center; }
        .login-box h1 { color: #00adb5; font-size: 22px; margin-bottom: 6px; }
        .login-box p.sub { color: #888; font-size: 13px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 6px; border: 2px solid #333; background: #252525; color: #fff; font-size: 15px; }
        .login-box input.focusable:focus { border-color: #00adb5; outline: none; box-shadow: 0 0 10px rgba(0,173,181,0.5); }
        .btn-login { width: 100%; padding: 12px; background: #00adb5; color: #fff; font-weight: bold; border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 4px; }
        .btn-login.focusable:focus { border-color: #fff; outline: none; }
        .login-error { color: #ff4d4d; font-size: 13px; margin-top: 10px; min-height: 16px; }
        .admin-link { margin-top: 18px; font-size: 12px; color: #666; cursor: pointer; text-decoration: underline; }
        .admin-link.focusable:focus { color: #00adb5; outline: none; }

        /* ============ TV PLAYER SCREEN ============ */
        #tvScreen { height: 100vh; position: relative; }
        .player-container { position: relative; width: 100%; height: 100vh; background: #000; }
        .video-js { width: 100% !important; height: 100vh !important; }
        .floating-controls { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 25; }
        .float-btn { background: rgba(24,24,24,0.85); color: #ddd; border: 2px solid transparent; border-radius: 6px; padding: 10px 16px; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px); white-space: nowrap; }
        .float-btn.focusable:focus { border-color: #00adb5; color: #fff; outline: none; }
        .now-playing-label { position: absolute; bottom: 70px; right: 20px; background: rgba(0,0,0,0.75); color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 15px; z-index: 25; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; max-width: 60%; word-wrap: break-word; direction: ltr; text-align: right; }
        .now-playing-label.show { opacity: 1; }

        .channel-overlay { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; max-width: 90%; background: rgba(14,14,14,0.97); border-left: 2px solid #282828; padding: 18px; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease; z-index: 30; }
        .channel-overlay.open { transform: translateX(0); }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
        .filter-tabs { display: flex; gap: 8px; }
        .tab { padding: 8px 12px; background: #252525; border-radius: 6px; font-size: 12px; color: #ccc; cursor: pointer; border: 2px solid transparent; white-space: nowrap; }
        .tab.active { background: #00adb5; color: #fff; }
        .tab.focusable:focus { border-color: #fff; outline: none; }
        .close-list-btn { background: #252525; color: #ddd; border: 2px solid transparent; border-radius: 6px; padding: 8px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .close-list-btn.focusable:focus { border-color: #fff; background: #b53d3d; outline: none; }
        .channel-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .channel-item { padding: 12px 16px; background: #252525; border-radius: 6px; cursor: pointer; font-size: 15px; color: #ddd; border: 2px solid transparent; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .channel-item .channel-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channel-item.focusable:focus { background: #00adb5; color: #fff; border-color: #ffffff; outline: none; }
        .channel-item.playing { border-right: 5px solid #00ff66; }
        .fav-star { font-size: 17px; color: #555; cursor: pointer; flex-shrink: 0; }
        .fav-star.active { color: #ffcc00; }

        /* ============ ADMIN DASHBOARD SCREEN ============ */
        #adminScreen { height: 100vh; width: 100%; padding: 20px; flex-direction: column; overflow: hidden; }
        .admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .admin-topbar h1 { color: #00adb5; font-size: 20px; }
        .logout-btn { background: #b53d3d; border: none; padding: 8px 16px; border-radius: 6px; color: #fff; cursor: pointer; }
        .admin-body { display: flex; gap: 18px; flex: 1; min-height: 0; }
        .admin-form-panel { flex: 1; min-width: 300px; background: #181818; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; }
        .admin-form-panel h2 { color: #00adb5; font-size: 16px; margin-bottom: 14px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 2px solid #333; background: #252525; color: #fff; font-size: 14px; }
        .form-group input.focusable:focus { border-color: #00adb5; outline: none; }
        .btn-submit { width: 100%; padding: 11px; background: #00adb5; color: #fff; font-weight: bold; border: 2px solid transparent; border-radius: 6px; cursor: pointer; margin-top: 6px; font-size: 14px; }
        .btn-submit.focusable:focus { border-color: #fff; outline: none; }
        .admin-table-panel { flex: 2; min-width: 360px; background: #181818; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; min-height: 0; }
        .admin-table-panel h2 { color: #00adb5; font-size: 16px; margin-bottom: 12px; }
        .table-container { flex: 1; overflow-y: auto; border: 1px solid #282828; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #282828; padding: 8px; text-align: center; }
        th { background: #222; color: #00adb5; position: sticky; top: 0; }
        .status-active { color: #00ff66; font-weight: bold; }
        .status-expired { color: #ff4d4d; font-weight: bold; }
        .status-blocked { color: #ffb84d; font-weight: bold; }
        .row-btn { border: none; border-radius: 4px; padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: pointer; color: #fff; margin: 2px; }
        .btn-block { background: #b53d3d; }
        .btn-unblock { background: #2e8b57; }
        .btn-delete { background: #444; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen active">
        <div class="login-box">
            <h1>Att.TV</h1>
            <p class="sub">تکایە بچۆ ژوورەوە بۆ بینینی کەناڵەکان</p>
            <input type="text" id="loginUsername" class="focusable" placeholder="ناوی بەکارهێنەر">
            <input type="password" id="loginPassword" class="focusable" placeholder="وشەی نهێنی">
            <button class="btn-login focusable" id="btnUserLogin">چوونەژوورەوە</button>
            <div class="login-error" id="loginError"></div>
            <div class="admin-link focusable" id="adminLoginLink">چوونەژوورەوەی بەڕێوەبەر</div>
        </div>
    </div>

    <!-- TV PLAYER SCREEN -->
    <div id="tvScreen" class="screen">
        <div class="player-container">
            <video id="tv-player" class="video-js vjs-default-skin" controls preload="auto">
                <source src="" type="application/x-mpegURL">
            </video>
            <div class="floating-controls">
                <button class="float-btn focusable" id="btnToggleList">☰ لیستی کەناڵەکان</button>
                <button class="float-btn focusable" id="btnTvLogout">چوونەدەرەوە</button>
            </div>
            <div class="now-playing-label" id="nowPlayingLabel"></div>
        </div>

        <div class="channel-overlay" id="channelOverlay">
            <div class="overlay-header">
                <div class="filter-tabs">
                    <div class="tab focusable active" data-filter="all">هەمووی</div>
                    <div class="tab focusable" data-filter="fav">★ دڵخوازەکان</div>
                </div>
                <button class="close-list-btn focusable" id="btnCloseList">داخستن ✕</button>
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminScreen" class="screen">
        <div class="admin-topbar">
            <h1>داشبۆردی بەڕێوەبەر (Google Sheets Integrated)</h1>
            <button class="logout-btn focusable" id="btnAdminLogout">چوونەدەرەوە</button>
        </div>
        <div class="admin-body">
            <div class="admin-form-panel">
                <h2>زیادکردنی بەکارهێنەری نوێ</h2>
                <form id="userForm">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر:</label>
                        <input type="text" id="newUsername" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی:</label>
                        <input type="text" id="newPassword" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>کاتی دەستپێکردن:</label>
                        <input type="date" id="startDate" class="focusable" required>
                    </div>
                    <div class="form-group">
                        <label>کاتی بەسەرچوون:</label>
                        <input type="date" id="expireDate" class="focusable" required>
                    </div>
                    <button type="submit" id="btnSave" class="btn-submit focusable">زیادکردن بۆ Sheet</button>
                </form>
            </div>

            <div class="admin-table-panel">
                <h2>بەکارهێنەرە تۆمارکراوەکان لە Sheet</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>بەکارهێنەر</th>
                                <th>دەستپێک</th>
                                <th>بەسەرچوون</th>
                                <th>بارودۆخ</th>
                                <th>کردار</th>
                            </tr>
                        </thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script src="https://vjs.zencdn.net/7.20.3/video.js"></script>

<script>
    // 🔗 لینکی نوێی Google Apps Script کە ناردت:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzueMQDE_jmGYHuPquWabCZ4gypKS5-Z8Ccd-BnPGAJshzE_bH7WiEXHjz1Ubi8__Ll/exec";
    const m3uUrl = "https://lehatkako904-droid.github.io/Atta_tv/ata-tv-all.m3u";

    const ADMIN_USER = "admin";
    const ADMIN_PASS = "admin123";

    let player = null;
    let focusableElements = [];
    let currentIndex = 0;
    let channelsData = [];
    let currentPlayIndex = -1;
    let channelsLoaded = false;

    function todayStr() {
        return new Date().toISOString().split('T')[0];
    }

    /* ---------- Google Sheets API Calls ---------- */
    async function fetchUsersFromSheet() {
        try {
            const res = await fetch(SCRIPT_URL);
            const users = await res.json();
            return Array.isArray(users) ? users : [];
        } catch (err) {
            console.error("کێشە لە ڕاکێشانی زانیاری لە Sheet:", err);
            return [];
        }
    }

    async function sendToSheet(payload) {
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            return true;
        } catch (err) {
            console.error("کێشە لە ناردنی داتا بۆ Sheet:", err);
            return false;
        }
    }

    /* ---------- Screen Navigation ---------- */
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        refreshFocusableList();
    }

    /* ---------- Login Flow ---------- */
    document.getElementById('btnUserLogin').onclick = async function() {
        const uname = document.getElementById('loginUsername').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();
        const errBox = document.getElementById('loginError');
        errBox.innerText = 'چاوەڕێ بکە... پشکنین دەکرێت';

        if (!uname || !pass) {
            errBox.innerText = 'تکایە ناو و وشەی نهێنی بنووسە.';
            return;
        }

        const users = await fetchUsersFromSheet();
        const found = users.find(u => String(u.username) === uname && String(u.password) === pass);

        if (!found) {
            errBox.innerText = 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە.';
            return;
        }
        if (found.blocked === true || String(found.blocked).toLowerCase() === "true") {
            errBox.innerText = '⛔ ئەم هەژمارە بلۆککراوە.';
            return;
        }
        if (found.expire < todayStr()) {
            errBox.innerText = '⏰ ماوەی بەکارهێنانی ئەم هەژمارە بەسەرچووە.';
            return;
        }

        errBox.innerText = '';
        loadChannelsIfNeeded();
        showScreen('tvScreen');
    };

    document.getElementById('adminLoginLink').onclick = function() {
        const u = prompt('ناوی بەکارهێنەری بەڕێوەبەر:');
        const p = prompt('وشەی نهێنی:');
        if (u === ADMIN_USER && p === ADMIN_PASS) {
            renderUserTable();
            showScreen('adminScreen');
        } else if(u !== null) {
            alert('ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە!');
        }
    };

    document.getElementById('btnAdminLogout').onclick = () => showScreen('loginScreen');
    document.getElementById('btnTvLogout').onclick = () => {
        if (player) player.pause();
        showScreen('loginScreen');
    };

    /* ---------- Admin Management ---------- */
    document.getElementById('userForm').onsubmit = async function(e) {
        e.preventDefault();
        const newUser = {
            action: "add",
            username: document.getElementById('newUsername').value.trim(),
            password: document.getElementById('newPassword').value.trim(),
            start: document.getElementById('startDate').value,
            expire: document.getElementById('expireDate').value
        };

        await sendToSheet(newUser);
        alert("تۆمارکردن ڕەوانەی Google Sheet کرا!");
        this.reset();
        setTimeout(renderUserTable, 1500);
    };

    async function renderUserTable() {
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = `<tr><td colspan="5">لە حاڵەتی هێنانی داتا لە Sheet...</td></tr>`;

        const users = await fetchUsersFromSheet();
        const today = todayStr();

        if (!users || users.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="5">هیچ بەکارهێنەرێک نه‌دۆزرایه‌وه‌.</td></tr>`;
            refreshFocusableList();
            return;
        }

        tbody.innerHTML = users.map(u => {
            const isBlocked = u.blocked === true || String(u.blocked).toLowerCase() === "true";
            const isExpired = u.expire < today;
            let statusHtml = isBlocked ? `<span class="status-blocked">بلۆککراوە</span>` :
                            (isExpired ? `<span class="status-expired">بەسەرچووە</span>` : `<span class="status-active">چالاکە</span>`);

            return `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.start || '--'}</td>
                    <td>${u.expire || '--'}</td>
                    <td>${statusHtml}</td>
                    <td>
                        <button class="row-btn focusable ${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u.username}')">${isBlocked ? 'لابردنی بلۆک' : 'بلۆککردن'}</button>
                        <button class="row-btn focusable btn-delete" onclick="deleteUser('${u.username}')">سڕینەوە</button>
                    </td>
                </tr>
            `;
        }).join('');

        refreshFocusableList();
    }

    async function toggleBlock(username) {
        await sendToSheet({ action: "toggleBlock", username: username });
        setTimeout(renderUserTable, 1500);
    }

    async function deleteUser(username) {
        if (!confirm('دڵنیایت لە سڕینەوەی ئەم بەکارهێنەرە؟')) return;
        await sendToSheet({ action: "delete", username: username });
        setTimeout(renderUserTable, 1500);
    }

    /* ---------- Channels Setup ---------- */
    function loadChannelsIfNeeded() {
        if (channelsLoaded) return;
        if (!player) player = videojs('tv-player');

        fetch(m3uUrl)
            .then(res => res.text())
            .then(data => {
                const lines = data.split('\n');
                let currentName = "";
                channelsData = [];

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        currentName = line.split(',')[1] || "کەناڵ";
                    } else if (line.startsWith('http')) {
                        channelsData.push({ name: currentName, url: line });
                    }
                });

                channelsLoaded = true;
                renderChannelList();
            });
    }

    function renderChannelList() {
        const listContainer = document.getElementById('channelList');
        listContainer.innerHTML = channelsData.map((c, idx) => `
            <div class="channel-item focusable" tabindex="0" onclick="playChannelByIndex(${idx})">
                <span class="channel-name">${c.name}</span>
            </div>
        `).join('');
        refreshFocusableList();
    }

    function playChannelByIndex(idx) {
        currentPlayIndex = idx;
        const ch = channelsData[idx];
        player.src({ src: ch.url, type: 'application/x-mpegURL' });
        player.play();
        document.getElementById('channelOverlay').classList.remove('open');
    }

    document.getElementById('btnToggleList').onclick = () => document.getElementById('channelOverlay').classList.toggle('open');
    document.getElementById('btnCloseList').onclick = () => document.getElementById('channelOverlay').classList.remove('open');

    /* ---------- Remote Control Navigation ---------- */
    function refreshFocusableList() {
        const activeScreen = document.querySelector('.screen.active');
        if (!activeScreen) return;
        focusableElements = Array.from(activeScreen.querySelectorAll('.focusable'));
        if (focusableElements.length > 0) setFocus(0);
    }

    function setFocus(index) {
        if (index < 0) index = 0;
        if (index >= focusableElements.length) index = focusableElements.length - 1;
        currentIndex = index;
        focusableElements[currentIndex].focus();
    }

    document.addEventListener('keydown', function(e) {
        if (focusableElements.length === 0) return;
        if (e.key === 'ArrowDown') setFocus(currentIndex + 1);
        if (e.key === 'ArrowUp') setFocus(currentIndex - 1);
        if (e.key === 'Enter') document.activeElement.click();
    });

    window.onload = refreshFocusableList;
</script>
</body>
</html>
